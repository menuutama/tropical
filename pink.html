<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event System - Pink Award</title>

<link rel="stylesheet" href="style.css">
<!-- CSS Tambahan untuk susunan Layout (Boleh dipindahkan ke style.css) -->

</head>

<body>

<!-- ===== HEADER NAV START ===== -->
<div class="topnav">
  <a href="index.html">MENU</a>
  <a href="lucky.html">LUCKY DRAW</a>
  <a href="pink.html">PINK AWARD</a>
  <a href="service.html">LONG SERVICE</a>
  <a href="media.html">VIDEO / IMAGE / SONG</a>
</div>
<!-- ===== HEADER NAV END ===== -->


<!-- ===== CONTENT START ===== -->
<div class="content-container">
  
  <!-- Carian dan Pilihan Kategori -->
  <div class="search-wrapper">
    <input type="text" id="searchBar" placeholder="Cari nama atau detail...">
    
    <select id="categoryDropdown">
      <option value="All Company">All Company</option>
      <option value="Tropical Consolidated">Tropical Consolidated</option>
      <option value="Tropical Canning">Tropical Canning</option>
      <option value="TC Boy">TC Boy</option>
      <option value="NamHeng Brothers">NamHeng Brothers</option>
      <option value="TC Venture">TC Venture</option>
    </select>
  </div>

  <!-- Ruangan untuk memaparkan gambar banner -->
  <div id="gallery" class="gallery-container">
    <!-- Gambar akan keluar di sini secara automatik via JavaScript -->
  </div>

</div>
<!-- ===== CONTENT END ===== -->

<!-- ===== FOOTER JS START ===== -->

<script>
  // Contoh data yang terhasil/di-fetch dari Google Sheets 'pinkAward'
// Column C = company, Column D = bannerUrl. (Ditambah lajur 'name' jika ada untuk carian)
let pinkAwardData = []; 

// 1. Fungsi untuk dapatkan data dari Google Sheet (Suaikan dengan fungsi sedia ada dalam api.js anda)
async function fetchPinkAwardData() {
  try {
    // Sila gantikan URL ini dengan endpoint API / Apps Script anda yang memulangkan data sheet pinkAward
    // Pastikan data dipulangkan mengikut susunan baris asal Google Sheets
    const response = await fetch('https://script.google.com/macros/s/AKfycbxKNKr_MZa774gBu9kf5uVrwCgZA_UJ1yKuFsvGu8YgDbCJwHrj7kDQxzZAgQZpKUCn/exec'); 
    const data = await response.json();
    
    pinkAwardData = data; // Simpan data dalam array global
    renderGallery(pinkAwardData); // Papar semua gambar pada permulaan (tanpa search)
  } catch (error) {
    console.error("Gagal mengambil data dari Google Sheets:", error);
  }
}

//2. Fungsi untuk memaparkan kotak gambar banner (Urutan asal dikekalkan)
function renderGallery(dataToDisplay) {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = ''; // Kosongkan galeri sebelum render baru

  // Jika tiada hasil padanan selepas search
  if (dataToDisplay.length === 0) {
    gallery.innerHTML = '<p style="text-align:center; width:100%; color:#666;">Tiada banner ditemui.</p>';
    return;
  }

  // Paparkan setiap data pautan dari Column D4:D ke dalam kotak
  dataToDisplay.forEach(item => {
    const card = document.createElement('div');
    card.className = 'banner-card';
    
    // Memaparkan elemen gambar sahaja di dalam kotak berdasarkan Column D
    // Jika link rosak atau tiada, imej gantian (placeholder) akan dipaparkan
    card.innerHTML = `
      <img src="${item.bannerUrl || ''}" alt="Banner ${item.name}" onerror="this.src='https://placehold.co'">
    `;
    gallery.appendChild(card);
  });
}

//3. Fungsi Carian Nama Pekerja (Column B) & Penapisan Syarikat (Column C)
function filterData() {
  const searchText = document.getElementById('searchBar').value.toLowerCase();
  const selectedCategory = document.getElementById('categoryDropdown').value;

  // Menapis data tanpa mengubah urutan/sorting asal baris Google Sheets
  const filtered = pinkAwardData.filter(item => {
    // 1. Semak padanan kategori dropdown dengan data syarikat (Column C)
    const matchesCategory = (selectedCategory === "All Company" || item.company === selectedCategory);
    
    // 2. Semak padanan teks search bar dengan nama pekerja (Column B)
    const matchesSearch = item.name.toLowerCase().includes(searchText); 

    return matchesCategory && matchesSearch;
  });

  // Paparkan semula kotak gambar yang menepati syarat carian
  renderGallery(filtered);
}


// 4. Set Event Listeners selepas halaman selesai dimuatkan
document.addEventListener('DOMContentLoaded', () => {
  // Jalankan fetch data Google Sheets
  fetchPinkAwardData();

  // Dengar perubahan pada search bar (bila ditaip)
  document.getElementById('searchBar').addEventListener('input', filterData);
  
  // Dengar perubahan pada dropdown kategori (bila dipilih)
  document.getElementById('categoryDropdown').addEventListener('change', filterData);
});

</script>


</body>
</html>
<!-- ===== FOOTER JS END ===== -->
