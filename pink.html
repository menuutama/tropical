<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event System - Pink Award</title>

<link rel="stylesheet" href="style.css">
<!-- CSS Tambahan untuk susunan Layout (Boleh dipindahkan ke style.css) -->
<style>
  .search-wrapper {
    display: flex;
    gap: 10px;
    margin: 20px;
    justify-content: center;
  }
  .search-wrapper input, .search-wrapper select {
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .search-wrapper input {
    width: 300px;
  }
  .gallery-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
  }
  .banner-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    text-align: center;
    background: #fff;
  }
  .banner-card img {
    width: 100%;
    height: auto;
    display: block;
  }
  .banner-info {
    padding: 10px;
    font-weight: bold;
  }
</style>
</head>

<body>

<!-- ===== HEADER NAV START ===== -->
<div class="topnav">
  <a href="index.html">MENU</a>
  <a href="lucky.html">LUCKY DRAW</a>
  <a href="pink.html">PINK AWARD</a>
  <a href="service.html">LONG SERVICE</a>
  <a href="media.html">VIDEO / IMAGE / SONG</a>
</div>
<!-- ===== HEADER NAV END ===== -->


<!-- ===== CONTENT START ===== -->
<div class="content-container">
  
  <!-- Carian dan Pilihan Kategori -->
  <div class="search-wrapper">
    <input type="text" id="searchBar" placeholder="Cari nama atau detail...">
    
    <select id="categoryDropdown">
      <option value="All Company">All Company</option>
      <option value="Tropical Consolidated">Tropical Consolidated</option>
      <option value="Tropical Canning">Tropical Canning</option>
      <option value="TC Boy">TC Boy</option>
      <option value="NamHeng Brothers">NamHeng Brothers</option>
      <option value="TC Venture">TC Venture</option>
    </select>
  </div>

  <!-- Ruangan untuk memaparkan gambar banner -->
  <div id="gallery" class="gallery-container">
    <!-- Gambar akan keluar di sini secara automatik via JavaScript -->
  </div>

</div>
<!-- ===== CONTENT END ===== -->

<script src="config.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>

</body>
</html>
