<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event System</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== HEADER NAV START ===== -->
<div class="topnav">

  <a href="https://menuutama.github.io/tropical/index.html">MENU</a>

  <a href="https://menuutama.github.io/tropical/lucky.html">
    LUCKY DRAW
  </a>

  <a href="http://localhost:3000/pink.html">
    PINK AWARD
  </a>

  <a href="http://localhost:3000/service.html">
    LONG SERVICE
  </a>

  <a href="http://localhost:3000/media.html">
    VIDEO / IMAGE / SONG
  </a>

  <a href="#" class="localhost-link" id="localhostBtn">
    <span class="localhost-toggle offline" id="localhostToggle">
      <span class="localhost-knob"></span>
    </span>
    <span class="localhost-text">LOCALHOST</span>
  </a>
<a href="#" class="update-link" id="updateBtn" style="display:none;">
  UPDATE
</a>
  
</div>
<!-- ===== HEADER NAV END ===== -->


<!-- ===== CONTENT START ===== -->
<iframe
  src="https://menuutama.github.io/tropical-dinner/"
  style="width:100%; height:100vh; border:none; position:fixed;">
</iframe>
<!-- ===== CONTENT END ===== -->


<!-- ===== FOOTER JS START ===== -->
<script>
const LOCALHOST_URL = "http://localhost:3000";

const OFFLINE_ZIP_URL =
"https://drive.google.com/uc?export=download&id=17PHzeTr8N1rHeiR1WrT4c6XBXqAyiBPT";

async function checkLocalhostStatus(){
  const toggle = document.getElementById("localhostToggle");

  if(!toggle) return false;

  try{
    const res = await fetch(`${LOCALHOST_URL}/api/status?time=${Date.now()}`, {
      method: "GET",
      cache: "no-store"
    });

    if(res.ok){
      toggle.classList.remove("offline");
      toggle.classList.add("online");
      return true;
    }

  }catch(e){}

  toggle.classList.remove("online");
  toggle.classList.add("offline");
  return false;
}

document.addEventListener("DOMContentLoaded", function(){
  const btn = document.getElementById("localhostBtn");

  checkLocalhostStatus();

  setInterval(checkLocalhostStatus, 3000);

  if(btn){
    btn.addEventListener("click", async function(e){
      e.preventDefault();

      const isOnline = await checkLocalhostStatus();

      if(isOnline){
        const confirmOff = confirm("Turn OFF localhost?");

        if(confirmOff){
          try{
            await fetch(`${LOCALHOST_URL}/api/shutdown?time=${Date.now()}`, {
              method: "GET",
              cache: "no-store"
            });
          }catch(e){}

          setTimeout(checkLocalhostStatus, 1200);
        }

      }else{
        window.open(
          OFFLINE_ZIP_URL,
          "DownloadOfflinePopup",
          "width=700,height=600,left=300,top=120,resizable=yes,scrollbars=yes"
        );
      }
    });
  }
});
</script>

</body>
</html>
