<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tropical Dinner 2026 - Admin Panel</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- PASSWORD SCREEN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h1>TROPICAL DINNER 2026</h1>
    <h2>Admin Panel Login</h2>

    <input
      type="password"
      id="passwordInput"
      placeholder="Enter Password"
      autocomplete="off"
    >

    <button id="loginBtn">LOGIN</button>

    <p id="loginError"></p>
  </div>
</div>

<!-- ADMIN SYSTEM -->
<div id="adminSystem" style="display:none;">

  <div class="topnav">

    <div class="nav-left">
      <button class="hamburger-btn" id="hamburgerBtn">☰</button>
    </div>

    <div class="nav-center">

      <button class="nav-btn active" data-url="https://menuutama.github.io/tropical-dinner/">
        MENU
      </button>

      <button class="nav-btn" data-url="https://menuutama.github.io/tropical-dinner/attend.html">
        REGISTRATION
      </button>

      <button class="nav-btn" data-url="https://menuutama.github.io/tropical-dinner/input.html">
        LUCKY DRAW
      </button>

      <button class="nav-btn" data-url="https://menuutama.github.io/tropical-dinner/collect.html">
        COLLECT PRIZE
      </button>

      <button class="nav-btn" data-url="http://localhost:3000/pink.html">
        PINK AWARD
      </button>

      <button class="nav-btn" data-url="http://localhost:3000/service.html">
        LONG SERVICE
      </button>

      <button class="nav-btn" data-url="http://localhost:3000/media.html">
        MEDIA
      </button>

    </div>

    <div class="nav-right">

      <a href="#" class="localhost-link" id="localhostBtn">
        <span class="localhost-toggle offline" id="localhostToggle">
          <span class="localhost-knob"></span>
        </span>
        <span class="localhost-text">LOCALHOST</span>
      </a>

      <a href="#" class="update-link" id="updateBtn" style="display:none;">
        <img
          src="https://i.ibb.co/k6XJsJBT/989cb1c8-74d7-4e55-8d53-8481139cebb6.png"
          alt="Update"
        >
      </a>

    </div>

  </div>

  <div class="side-overlay" id="sideOverlay"></div>

  <div class="side-menu" id="sideMenu">

    <div class="side-header">
      <span>ADMIN MENU</span>
      <button class="side-close" id="sideClose">×</button>
    </div>

    <button class="side-btn active" data-url="https://menuutama.github.io/tropical-dinner/">MENU</button>
    <button class="side-btn" data-url="https://menuutama.github.io/tropical-dinner/attend.html">REGISTRATION</button>
    <button class="side-btn" data-url="https://menuutama.github.io/tropical-dinner/input.html">LUCKY DRAW</button>
    <button class="side-btn" data-url="https://menuutama.github.io/tropical-dinner/collect.html">COLLECT PRIZE</button>
    <button class="side-btn" data-url="http://localhost:3000/pink.html">PINK AWARD</button>
    <button class="side-btn" data-url="http://localhost:3000/service.html">LONG SERVICE</button>
    <button class="side-btn" data-url="http://localhost:3000/media.html">MEDIA</button>

  </div>

  <div class="iframe-wrap">
    <iframe
      id="mainFrame"
      src="https://menuutama.github.io/tropical-dinner/"
    ></iframe>
  </div>

</div>

<script>
const ADMIN_PASSWORD = "Admin-dinner123";

const loginScreen = document.getElementById("loginScreen");
const adminSystem = document.getElementById("adminSystem");
const passwordInput = document.getElementById("passwordInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

function showAdmin(){
  loginScreen.style.display = "none";
  adminSystem.style.display = "block";
}

function showLogin(){
  loginScreen.style.display = "flex";
  adminSystem.style.display = "none";
}

function login(){
  const password = passwordInput.value.trim();

  if(password === ADMIN_PASSWORD){
    sessionStorage.setItem("adminLogin", "yes");
    showAdmin();
  }else{
    loginError.textContent = "Wrong password.";
    passwordInput.value = "";
    passwordInput.focus();
  }
}

if(sessionStorage.getItem("adminLogin") === "yes"){
  showAdmin();
}else{
  showLogin();
}

loginBtn.addEventListener("click", login);

passwordInput.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    login();
  }
});
</script>

<script src="index.js"></script>

</body>
</html>
