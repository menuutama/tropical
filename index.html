<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tropical Dinner 2026 - Admin Panel</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topnav">

  <button class="nav-btn active" onclick="loadPage(this,'https://menuutama.github.io/tropical-dinner/')">MENU</button>

  <button class="nav-btn" onclick="loadPage(this,'https://menuutama.github.io/tropical-dinner/attend.html')">REGISTRATION</button>

  <button class="nav-btn" onclick="loadPage(this,'https://menuutama.github.io/tropical-dinner/input.html')">LUCKY DRAW</button>

  <button class="nav-btn" onclick="loadPage(this,'https://menuutama.github.io/tropical-dinner/collect.html')">COLLECT PRIZE</button>

  <button class="nav-btn" onclick="loadPage(this,'http://localhost:3000/pink.html')">PINK AWARD</button>

  <button class="nav-btn" onclick="loadPage(this,'http://localhost:3000/service.html')">LONG SERVICE</button>

  <button class="nav-btn" onclick="loadPage(this,'http://localhost:3000/media.html')">MEDIA</button>

  <div class="localhost-link" onclick="toggleLocalhost()">
    <div id="localhostToggle" class="localhost-toggle">
      <div class="localhost-knob"></div>
    </div>
    <span id="localhostText">LOCALHOST OFF</span>
  </div>

  <button class="update-link has-update" onclick="checkUpdate()" title="Update">
    <img src="https://cdn-icons-png.flaticon.com/512/61/61444.png" alt="Update">
  </button>

</div>

<div class="frame-wrapper">
  <iframe id="mainFrame" src="https://menuutama.github.io/tropical-dinner/"></iframe>
</div>

<script>
const mainFrame = document.getElementById("mainFrame");
const localhostToggle = document.getElementById("localhostToggle");
const localhostText = document.getElementById("localhostText");

function loadPage(btn, url){
  mainFrame.src = url;

  document.querySelectorAll(".nav-btn").forEach(button=>{
    button.classList.remove("active");
  });

  btn.classList.add("active");
}

function toggleLocalhost(){
  localhostToggle.classList.toggle("online");

  if(localhostToggle.classList.contains("online")){
    localhostText.textContent = "LOCALHOST ON";
  }else{
    localhostText.textContent = "LOCALHOST OFF";
  }
}

function checkUpdate(){
  alert("Update button clicked.");
}
</script>

</body>
</html>
