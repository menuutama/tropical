<!DOCTYPE html>
<html lang="en"> 
  <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Lucky Draw System</title> 
    <link rel="stylesheet" href="style.css">
  </head>
  
  <body> 
    
    <!-- ===== HEADER NAV ===== -->
    <div class="topnav"> 
      <a href="index.html">MENU</a> 
      <a href="lucky.html">LUCKY DRAW</a>
      <a href="pink.html">PINK AWARD</a> 
      <a href="service.html">LONG SERVICE</a> 
      <a href="media.html">VIDEO / IMAGE / SONG</a> 
    </div> 
    
    <!-- ===== PAGE TITLE ===== -->
    <header class="hero-header">
      <h1>TROPICAL DINNER 2026</h1>
      <h2>Lucky Draw System</h2>
    </header> 
    
    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container"> 
      
      <!-- INPUT AREA -->
      <div class="input-box"> 
        <div class="input-container">
          <input type="text" id="luckyNo" placeholder="Enter Lucky No" oninput="toggleClearBtn()" onkeypress="if(event.key === 'Enter') addItem()"> 
          <button type="button" id="clearInputBtn" class="clear-btn" onclick="clearInput()">X</button>
        </div>
        <button onclick="addItem()"> Add </button> 
      </div> 
      
      <!-- TABLE AREA --> 
      <div class="main-content"> 
        <div class="table-wrapper">
          <table> 
            <thead>
              <tr> 
                <th>PLACE</th> 
                <th>LUCKY NO.</th>
                <th>WINNER</th>
                <th>COMPANY</th> 
                <th>PRIZE</th>
                <th>ACTION</th>
              </tr> 
            </thead> 
            <tbody id="winnerTable">
              <!-- Diisi secara dinamik melalui JavaScript -->
            </tbody> 
          </table> 
          
          <!-- PAGINATION BUTTONS -->
          <div id="pagination" class="pagination-container"></div>
        </div>
      </div> 
    </div>
    
    <!-- ===== JAVASCRIPT LOGIC ===== --> 
    <script>
      const API_URL = "https://google.com";
      let allData = [];

      // Konfigurasi Pagination
      let currentPage = 1;
      const rowsPerPage = 10;

      /* 1. MUAT TURUN & SUSUN DATA (SORT 1st -> 91st) */
      async function loadData(){
        try {
          const res = await fetch(API_URL);
          allData = await res.json(); 
          
          allData.sort((a, b) => {
            const matchA = (a.place || "").match(/\d+/);
            const matchB = (b.place || "").match(/\d+/);
            
            const numA = matchA ? parseInt(matchA[0], 10) : 999; 
            const numB = matchB ? parseInt(matchB[0], 10) : 999;
            
            return numA - numB; 
          });

          renderTable();
        } catch(err) {
          console.log("LOAD ERROR:", err);
        }
      }

      /* 2. PAPARKAN JADUAL MENGGUNA-HAD MAX 10 ROW */
      function renderTable(){
        const tbody = document.getElementById("winnerTable");
        tbody.innerHTML = "";

        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const paginatedItems = allData.slice(startIndex, endIndex);

        if (paginatedItems.length === 0 && currentPage > 1) {
          currentPage--;
          renderTable();
          return;
        }

        paginatedItems.forEach(item => {
          tbody.innerHTML += `
            <tr>
              <td>${item.place || ""}</td>
              <td>${item.luckyNo || ""}</td>
              <td>${item.winner || ""}</td>
              <td>${item.company || ""}</td>
              <td>${item.prize || ""}</td>
              <td>
                <button class="btn-edit" onclick="editRow('${item.row}')">Edit</button>
                <button class="btn-danger" onclick="deleteRow('${item.row}')">Delete</button>
              </td>
            </tr>
          `;
        });

        setupPagination();
      }

      /* 3. BINA INTERFAS PAGINATION */
      function setupPagination() {
        const paginationContainer = document.getElementById("pagination");
        paginationContainer.innerHTML = "";

        const totalPages = Math.ceil(allData.length / rowsPerPage);
        if (totalPages <= 1) return;

        // Button Previous
        const prevBtn = document.createElement("button");
        prevBtn.className = "pagination-btn";
        prevBtn.innerText = "| PREVIOUS |";
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => { currentPage--; renderTable(); };
        paginationContainer.appendChild(prevBtn);

        // Angka Halaman
        for (let i = 1; i <= totalPages; i++) {
          const pageBtn = document.createElement("button");
          pageBtn.className = `pagination-btn ${currentPage === i ? 'active' : ''}`;
          pageBtn.innerText = i;
          pageBtn.onclick = () => { currentPage = i; renderTable(); };
          paginationContainer.appendChild(pageBtn);
        }

        // Button Next
        const nextBtn = document.createElement("button");
        nextBtn.className = "pagination-btn";
        nextBtn.innerText = "| NEXT |";
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => { currentPage++; renderTable(); };
        paginationContainer.appendChild(nextBtn);
      }

      /* 4. TAMBAH DATA (CARI & ISI DENGAN SEKATAN) */
      async function addItem(){
        const luckyNoInput = document.getElementById("luckyNo");
        const luckyNo = luckyNoInput.value.trim();

        if(!luckyNo){
          alert("Enter lucky number");
          return;
        }

        try {
          const res = await fetch(API_URL + "?action=add&luckyNo=" + encodeURIComponent(luckyNo));
          const result = await res.json();

          if(result.status === "not_found") {
            alert("Lucky Draw No. Not Found"); 
          } else if(result.status === "duplicate") {
            alert("Nombor bertuah ini sudah pun didaftarkan!");
          } else if(result.status === "success") {
            luckyNoInput.value = "";
            toggleClearBtn();
            setTimeout(loadData, 1000); 
          } else if(result.status === "error") {
            alert(result.message); 
          }
        } catch (error) {
          console.error("Ralat komunikasi API:", error);
        }
      }

      /* 5. URUSAN BUTANG X CLEAR INPUT */
      function toggleClearBtn() {
        const inputVal = document.getElementById("luckyNo").value;
        const clearBtn = document.getElementById("clearInputBtn");
        clearBtn.style.display = inputVal.length > 0 ? "block" : "none";
      }

      function clearInput() {
        const inputField = document.getElementById("luckyNo");
        inputField.value = "";
        inputField.focus();
        toggleClearBtn();
      }

      /* 6. PADAM DATA BARIS */
      async function deleteRow(row){
        if(confirm("Adakah anda pasti mahu memadam baris ini?")) {
          await fetch(API_URL + "?action=delete&row=" + row);
          setTimeout(loadData, 1000);
        }
      }

      /* 7. EDIT DATA BARIS */
      async function editRow(row){
        const newNo = prompt("New Lucky Number:");
        if(!newNo) return;

        await fetch(API_URL + "?action=edit&row=" + row + "&luckyNo=" + encodeURIComponent(newNo));
        setTimeout(loadData, 1000);
      }

      /* MULAKAN PROSES */
      loadData();
    </script>
  </body>
</html>
