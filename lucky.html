<!DOCTYPE html>
<html lang="en"> 
  <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Lucky Draw System</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  
  <body> 
    
    <!-- ===== HEADER NAV ===== -->
    
  <div class="topnav"> 
    <a href="index.html">MENU</a> 
    <a href="lucky.html">LUCKY DRAW</a>
    <a href="pink.html">PINK AWARD</a> 
    <a href="service.html">LONG SERVICE</a> 
    <a href="media.html">VIDEO / IMAGE / SONG</a> 
  </div> 
    
    <!-- ===== PAGE TITLE ===== -->
    <header class="hero-header">
      <h1>TROPICAL DINNER 2026</h1>
      <h2>Lucky Draw System</h2>
    </header> 
    
    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container"> 
      
      <!-- INPUT AREA -->
      
      <div class="input-box"> 
        <input type="text" id="luckyNo" placeholder="Enter Lucky No" > 
        <button onclick="addItem()"> Add </button> 
      </div> 
      
      <!-- TABLE AREA --> 
      <div class="main-content"> 
        <div class="table-wrapper">
          <table> 
            <thead>
              <tr> 
                <th>PLACE</th> 
                <th>LUCKY NO.</th>
                <th>WINNER</th>
                <th>COMPANY</th> 
                <th>PRIZE</th>
                <th>ACTION</th>
              </tr> </thead> 
            <tbody id="winnerTable">
              
            </tbody> 
          </table> 
        </div>
      </div> 
    </div>
    
    <!-- ===== JS ===== --> 
   <script>

const API_URL = "https://script.google.com/macros/s/AKfycbzarjoBZD1mqbAJLURRHot4G1lX4wBiVmhKW5GKMcr18fujnxh_lmF9Vgmf-CYjDfh3/exec";

let allData = [];

/* LOAD DATA */
async function loadData(){
  try {
    const res = await fetch(API_URL);
    allData = await res.json(); 
    
    // --- FUNGSI SORTING (Small to Large mengikut Kolum A: 1st, 2nd, 3rd...) ---
    allData.sort((a, b) => {
      // Ekstrak nombor sahaja daripada string (contoh: "91st" jadi 91)
      const numA = parseInt(a.place) || 0;
      const numB = parseInt(b.place) || 0;
      return numA - numB;
    });

    console.log("Data Tersusun:", allData);
    renderTable();
  } catch(err) {
    console.log("LOAD ERROR:", err);
  }
}

/* RENDER TABLE */
function renderTable(){
  const tbody = document.getElementById("winnerTable");
  tbody.innerHTML = "";

  allData.forEach(item => {
    tbody.innerHTML += `
      <tr>
        <td>${item.place || ""}</td>
        <td>${item.luckyNo || ""}</td>
        <td>${item.winner || ""}</td>
        <td>${item.company || ""}</td>
        <td>${item.prize || ""}</td>
        <td>
          <button onclick="editRow('${item.row}')">Edit</button>
          <button onclick="deleteRow('${item.row}')">Delete</button>
        </td>
      </tr>
    `;
  });
}

/* ADD ITEM (Kini bertindak sebagai fungsi Find & Fill) */
async function addItem(){
  const luckyNoInput = document.getElementById("luckyNo");
  const luckyNo = luckyNoInput.value.trim();

  if(!luckyNo){
    alert("Enter lucky number");
    return;
  }

  // Hantar request semakan ke API backend
  const res = await fetch(API_URL + "?action=add&luckyNo=" + encodeURIComponent(luckyNo));
  const result = await res.json();

  // --- SEMAKAN RESPONS RESPOND DARIPADA BACKEND ---
  if(result.status === "not_found") {
    alert("Lucky Draw No. Not Found"); // Pop-up amaran jika tiada dalam Sheet List
  } else if(result.status === "duplicate") {
    alert("Nombor ini sudah dimasukkan ke dalam senarai pemenang!");
  } else if(result.status === "success") {
    luckyNoInput.value = "";
    setTimeout(loadData, 1000); // Segarkan jadual selepas 1 saat
  } else {
    alert("Ralat sistem berlaku.");
  }
}

/* DELETE ROW */
async function deleteRow(row){
  if(confirm("Adakah anda pasti mahu memadam baris ini?")) {
    await fetch(API_URL + "?action=delete&row=" + row);
    setTimeout(loadData, 1000);
  }
}

/* EDIT ROW */
async function editRow(row){
  const newNo = prompt("New Lucky Number:");
  if(!newNo) return;

  await fetch(API_URL + "?action=edit&row=" + row + "&luckyNo=" + encodeURIComponent(newNo));
  setTimeout(loadData, 1000);
}

/* INIT */
loadData();

</script>

  </body>
</html>
