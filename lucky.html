<!DOCTYPE html>
<html lang="en"> 
  <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Lucky Draw System</title> 
    <link rel="stylesheet" href="style.css">
  </head>
  
  <body> 
    
    <!-- ===== HEADER NAV ===== -->
    <div class="topnav"> 
      <a href="index.html">MENU</a> 
      <a href="lucky.html">LUCKY DRAW</a>
      <a href="pink.html">PINK AWARD</a> 
      <a href="service.html">LONG SERVICE</a> 
      <a href="media.html">VIDEO / IMAGE / SONG</a> 
    </div> 
    
    <!-- ===== PAGE TITLE ===== -->
    <header class="hero-header">
      <h1>TROPICAL DINNER 2026</h1>
      <h2>Lucky Draw System</h2>
    </header> 
    
    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container"> 
      
      <!-- INPUT AREA -->
      <div class="input-box"> 
        <div class="input-container">
          <input type="text" id="luckyNo" placeholder="Enter Lucky No" oninput="toggleClearBtn()" onkeypress="if(event.key === 'Enter') addItem()"> 
          <button type="button" id="clearInputBtn" class="clear-btn" onclick="clearInput()">X</button>
        </div>
        <button id="addBtn" onclick="addItem()"> Add </button> 
      </div> 
      
      <!-- TABLE AREA --> 
      <div class="main-content"> 
        <div class="table-wrapper">
          <table> 
            <thead>
              <tr> 
                <th>PLACE</th> 
                <th>LUCKY NO.</th>
                <th>WINNER</th>
                <th>COMPANY</th> 
                <th>PRIZE</th>
                <th>ACTION</th>
              </tr> 
            </thead> 
            <tbody id="winnerTable">
              <!-- Diisi secara dinamik melalui JavaScript -->
            </tbody> 
          </table> 
          
          <!-- PAGINATION BUTTONS -->
          <div id="pagination" class="pagination-container"></div>
        </div>
      </div> 
    </div>
    
    <!-- ===== JAVASCRIPT LOGIC ===== --> 
    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbyEIR8saftBM9WH1l-CCbF7d0KdUsbrlmmSfjT-pHcKKgx7B2u6bdWUWYSItL-rJ1bp/exec";
      let allData = [];

      // Konfigurasi Pagination
      let currentPage = 1;
      const rowsPerPage = 10;

      /* FUNGSI SUSUN DATA (Helper) */
      function sortData(data) {
        return data.sort((a, b) => {
          const numA = parseInt((a.place || "").match(/\d+/) ? (a.place || "").match(/\d+/)[0] : 999, 10);
          const numB = parseInt((b.place || "").match(/\d+/) ? (b.place || "").match(/\d+/)[0] : 999, 10);
          return numA - numB; 
        });
      }

      /* 1. MUAT TURUN & SUSUN DATA */
      async function loadData(){
        try {
          const res = await fetch(API_URL);
          const data = await res.json(); 
          allData = sortData(data);
          renderTable();
        } catch(err) {
          console.error("LOAD ERROR:", err);
        }
      }

      /* 2. PAPARKAN JADUAL SECARA PUKAL */
      function renderTable(){
        const tbody = document.getElementById("winnerTable");
        
        const startIndex = (currentPage - 1) * rowsPerPage;
        const endIndex = startIndex + rowsPerPage;
        const paginatedItems = allData.slice(startIndex, endIndex);

        if (paginatedItems.length === 0 && currentPage > 1) {
          currentPage--;
          renderTable();
          return;
        }

        tbody.innerHTML = paginatedItems.map(item => `
          <tr>
            <td>${item.place || ""}</td>
            <td>${item.luckyNo || ""}</td>
            <td>${item.winner || ""}</td>
            <td>${item.company || ""}</td>
            <td>${item.prize || ""}</td>
            <td>
              <button class="btn-edit" onclick="editRow('${item.row}')">Edit</button>
              <button class="btn-danger" onclick="deleteRow('${item.row}')">Delete</button>
            </td>
          </tr>
        `).join("");

        setupPagination();
      }

      /* 3. BINA INTERFAS PAGINATION (MAKSIMUM 3 ANGKA DI TAYANG) */
function setupPagination() {
  const paginationContainer = document.getElementById("pagination");
  paginationContainer.innerHTML = "";

  const totalPages = Math.ceil(allData.length / rowsPerPage);
  if (totalPages <= 1) return;

  // 1. Cipta butang PREVIOUS
  const prevBtn = document.createElement("button");
  prevBtn.className = "pagination-btn";
  prevBtn.innerText = "Previous";
  prevBtn.disabled = currentPage === 1;
  prevBtn.onclick = () => { currentPage--; renderTable(); };
  paginationContainer.appendChild(prevBtn);

  // LOGIK BARU: Tentukan julat mula dan tamat untuk 3 butang sahaja
  let startPage = currentPage - 1;
  let endPage = currentPage + 1;

  // Jika di halaman pertama, tunjuk halaman 1, 2, 3
  if (startPage < 1) {
    startPage = 1;
    endPage = Math.min(3, totalPages);
  }

  // Jika di halaman terakhir, tunjuk 3 halaman terakhir
  if (endPage > totalPages) {
    endPage = totalPages;
    startPage = Math.max(1, totalPages - 2);
  }

  // 2. Cipta butang angka berdasarkan julat yang dikira (Maksimum 3 butang)
  for (let i = startPage; i <= endPage; i++) {
    const pageBtn = document.createElement("button");
    pageBtn.className = `pagination-btn ${currentPage === i ? 'active' : ''}`;
    pageBtn.innerText = i;
    pageBtn.onclick = () => { currentPage = i; renderTable(); };
    paginationContainer.appendChild(pageBtn);
  }

  // 3. Cipta butang NEXT
  const nextBtn = document.createElement("button");
  nextBtn.className = "pagination-btn";
  nextBtn.innerText = "Next";
  nextBtn.disabled = currentPage === totalPages;
  nextBtn.onclick = () => { currentPage++; renderTable(); };
  paginationContainer.appendChild(nextBtn);
}

      /* 4. TAMBAH DATA (Kemas Kini Tempatan + Auto Padam Input Jika Salah) */
      async function addItem(){
        const luckyNoInput = document.getElementById("luckyNo");
        const addBtn = document.getElementById("addBtn");
        const luckyNo = luckyNoInput.value.trim();

        if(!luckyNo) return alert("Enter lucky number");

        addBtn.disabled = true;
        addBtn.innerText = "Adding...";

        try {
          const res = await fetch(`${API_URL}?action=add&luckyNo=${encodeURIComponent(luckyNo)}`);
          const result = await res.json();

          if(result.status === "not_found") {
            alert("Lucky Draw No. Not Found"); 
            clearInput(); // <--- Fungsi Tambahan: Auto padam & fokus semula
          } else if(result.status === "duplicate") {
            alert("Nombor bertuah ini sudah pun didaftarkan!");
            clearInput(); // <--- Fungsi Tambahan: Auto padam & fokus semula
          } else if(result.status === "success") {
            luckyNoInput.value = "";
            toggleClearBtn();
            
            // Mengemas kini data lokal jika ada respon data penuh dari server
            if(result.data) {
              // Jika data sedia ada mempunyai row yang sama (kes ganti template kosong), buang yang lama
              allData = allData.filter(item => String(item.row) !== String(result.data.row));
              allData.push(result.data);
              allData = sortData(allData);
              renderTable();
            } else {
              await loadData();
            }
          } else if(result.status === "error") {
            alert(result.message); 
            clearInput();
          }
        } catch (error) {
          console.error("Ralat komunikasi API:", error);
        } finally {
          addBtn.disabled = false;
          addBtn.innerText = "Add";
        }
      }

      /* 5. URUSAN BUTANG X CLEAR INPUT */
      function toggleClearBtn() {
        const inputVal = document.getElementById("luckyNo").value;
        document.getElementById("clearInputBtn").style.display = inputVal.length > 0 ? "block" : "none";
      }

      function clearInput() {
        const inputField = document.getElementById("luckyNo");
        inputField.value = "";
        inputField.focus();
        toggleClearBtn();
      }

      /* 6. PADAM DATA BARIS (Kemas Kini Tempatan - Pantas Tanpa Reload) */
      async function deleteRow(row){
        if(!confirm("Adakah anda pasti mahu memadam baris ini?")) return;

        try {
          const res = await fetch(`${API_URL}?action=delete&row=${row}`);
          const result = await res.json();
          
          if(result.status === "success") {
            // Padam terus dari memori array browser
            allData = allData.filter(item => String(item.row) !== String(row));
            renderTable();
          } else {
            alert("Gagal memadam data di server.");
          }
        } catch (error) {
          console.error("Error deleting:", error);
        }
      }

      /* 7. EDIT DATA BARIS (Kemas Kini Tempatan - Pantas Tanpa Reload) */
      async function editRow(row){
        const newNo = prompt("New Lucky Number:");
        if(!newNo) return;

        try {
          const res = await fetch(`${API_URL}?action=edit&row=${row}&luckyNo=${encodeURIComponent(newNo)}`);
          const result = await res.json();

          if(result.status === "success") {
            const index = allData.findIndex(item => String(item.row) === String(row));
            if(index !== -1) {
              if(result.data) {
                allData[index] = { ...allData[index], ...result.data };
              } else {
                allData[index].luckyNo = newNo;
              }
              allData = sortData(allData);
              renderTable();
            }
          } else {
            alert("Gagal mengedit data di server.");
          }
        } catch (error) {
          console.error("Error editing:", error);
        }
      }

      /* MULAKAN PROSES */
      loadData();
    </script>
  </body>
</html>
