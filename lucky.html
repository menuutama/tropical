<!DOCTYPE html>
<html lang="en"> 
  <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Lucky Draw System</title> 
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  
  <body> 
    
    <!-- ===== HEADER NAV ===== -->
    
  <div class="topnav"> 
    <a href="index.html">MENU</a> 
    <a href="lucky.html">LUCKY DRAW</a>
    <a href="pink.html">PINK AWARD</a> 
    <a href="service.html">LONG SERVICE</a> 
    <a href="media.html">VIDEO / IMAGE / SONG</a> 
  </div> 
    
    <!-- ===== PAGE TITLE ===== -->
    <header class="hero-header">
      <h1>TROPICAL DINNER 2026</h1>
      <h2>Lucky Draw System</h2>
    </header> 
    
    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container"> 
      
      <!-- INPUT AREA -->
      
      <div class="input-box"> 
        <input type="text" id="luckyNo" placeholder="Enter Lucky No" > 
        <button onclick="addItem()"> Add </button> 
      </div> 
      
      <!-- TABLE AREA --> 
      <div class="main-content"> 
        <div class="table-wrapper">
          <table> 
            <thead>
              <tr> 
                <th>PLACE</th> 
                <th>LUCKY NO.</th>
                <th>WINNER</th>
                <th>COMPANY</th> 
                <th>PRIZE</th>
                <th>ACTION</th>
              </tr> </thead> 
            <tbody id="winnerTable">
              
            </tbody> 
          </table> 
        </div>
      </div> 
    </div>
    
    <!-- ===== JS ===== --> 
   <script>

const API_URL = "https://script.google.com/macros/s/AKfycbyyoOJaNmEwqwAkQhjfT7j0WeE75ChDsSK66oI-aZD06_zbUQzVELTYd8e0oDtRS_bO/exec";

let allData = [];

/* LOAD */
async function loadData(){

  try{

    const res = await fetch(API_URL);
    const text = await res.text();

    console.log("RAW:", text);

    allData = JSON.parse(text);

    renderTable();

  }catch(err){
    console.log("LOAD ERROR:", err);
  }
}

/* RENDER */
function renderTable(){

  const tbody = document.getElementById("winnerTable");
  tbody.innerHTML = "";

  allData.forEach(item => {

    tbody.innerHTML += `
      <tr>
        <td>${item.place || ""}</td>
        <td>${item.luckyNo || ""}</td>
        <td>${item.winner || ""}</td>
        <td>${item.company || ""}</td>
        <td>${item.prize || ""}</td>
        <td>
          <button onclick="editRow('${item.row}')">Edit</button>
          <button onclick="deleteRow('${item.row}')">Delete</button>
        </td>
      </tr>
    `;
  });
}

/* ADD */
async function addItem(){

  const luckyNo = document.getElementById("luckyNo").value.trim();

  if(!luckyNo){
    alert("Enter lucky number");
    return;
  }

  await fetch(API_URL + "?action=add&luckyNo=" + encodeURIComponent(luckyNo));

  document.getElementById("luckyNo").value = "";

  loadData();
}

/* DELETE */
async function deleteRow(row){

  await fetch(API_URL + "?action=delete&row=" + row);

  loadData();
}

/* EDIT */
async function editRow(row){

  const newNo = prompt("New Lucky Number");

  if(!newNo) return;

  await fetch(API_URL + "?action=edit&row=" + row + "&luckyNo=" + encodeURIComponent(newNo));

  loadData();
}

/* INIT */
loadData();
setInterval(loadData, 5000);

</script>

  </body>
</html>
