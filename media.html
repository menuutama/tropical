<div class="content-container">

  <div class="theme-header-container">
    <h1 class="main-title">TROPICAL DINNER 2026</h1>
    <h2 class="sub-title">Event Media Hub</h2>
  </div>

  <div class="search-wrapper">
<div class="search-box">

  <input
    type="text"
    id="searchInput"
    placeholder="Search media name..."
  >

  <button
    id="clearSearch"
    type="button">
    X
  </button>

</div>

    <select id="typeFilter">
      <option value="">All Type</option>
      <option value="Image">Image</option>
      <option value="Video">Video</option>
      <option value="Youtube">YouTube</option>
      <option value="Music">Music</option>
      <option value="YoutubeMusic">YouTube Music</option>
    </select>
  </div>

  <div class="preview-wrapper">
    <div id="previewArea" class="preview-screen">
      <div class="preview-placeholder">
        Select media from the list below
      </div>
    </div>
  </div>

  <div id="mediaGridContainer"></div>

</div>
