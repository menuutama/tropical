<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Event Media Hub</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="media.css">
</head>

<body>

<div class="topnav">
  <a href="index.html">MENU</a>
  <a href="lucky.html">LUCKY DRAW</a>
  <a href="pink.html">PINK AWARD</a>
  <a href="service.html">LONG SERVICE</a>
  <a href="media.html">VIDEO / IMAGE / SONG</a>
</div>

<div class="media-container">

  <h2>Event Media Hub</h2>

  <div class="search-filter-box">

    <select id="mediaTypeDropdown" onchange="tapisMedia()">
      <option value="all">Semua Jenis</option>
      <option value="video">Video 🎬</option>
      <option value="gambar">Gambar 📸</option>
      <option value="lagu">Lagu 🎵</option>
    </select>

    <input
      type="text"
      id="mediaSearchInput"
      placeholder="Cari nama fail..."
      onkeyup="tapisMedia()"
    >

    <button onclick="tapisMedia()">
      Cari
    </button>

  </div>

  <div class="media-grid" id="mediaGridContainer">

    <div
      class="media-item"
      data-jenis="video"
      data-nama="opening perasmian 1"
      onclick="paparMedia('video','https://www.w3schools.com/html/mov_bbb.mp4')">

      <div class="media-icon">🎬</div>
      <div class="media-title">
        Opening - Perasmian 1
      </div>

    </div>

    <div
      class="media-item"
      data-jenis="gambar"
      data-nama="pink award background"
      onclick="paparMedia('gambar','https://picsum.photos/1200/700')">

      <div class="media-icon">📸</div>
      <div class="media-title">
        Pink Award Background
      </div>

    </div>

    <div
      class="media-item"
      data-jenis="lagu"
      data-nama="gimmick perasmian song"
      onclick="paparMedia('lagu','https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">

      <div class="media-icon">🎵</div>
      <div class="media-title">
        Gimmick Perasmian Song
      </div>

    </div>

  </div>

  <div class="media-display-wrapper">

    <div class="media-display" id="mediaDisplayBox">

      <p id="placeholderText">
        Sila pilih media dari senarai di atas.
      </p>

      <img
        id="outputImage"
        src=""
        alt=""
        style="display:none;"
      >

      <video
        id="outputVideo"
        controls
        style="display:none;"
      >
        <source
          id="videoSource"
          src=""
          type="video/mp4">
      </video>

      <div
        id="audioPlayerContainer"
        style="display:none;"
      >

        <div class="audio-gimmick">
          🎵 Sedang Dimainkan...
        </div>

        <audio id="outputAudio" controls>
          <source
            id="audioSource"
            src=""
            type="audio/mp3">
        </audio>

      </div>

    </div>

    <div class="note-skrin">
      Tip: Tarik browser ke projector sebelum mainkan media.
    </div>

  </div>

</div>

<script src="media.js"></script>

<script src="config.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
<script src="api.js"></script>
<script src="include.js"></script>

</body>
</html>
